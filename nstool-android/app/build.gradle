plugins { id 'com.android.application' }
android {
    namespace 'com.cometinha.nstool'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cometinha.nstool'
        minSdk 26
        targetSdk 28
        versionCode 5
        versionName '0.1.0-beta5'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { assets.srcDirs += ['src/main/native-assets'] } }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
dependencies { implementation 'androidx.documentfile:documentfile:1.0.1' }
